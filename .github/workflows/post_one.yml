name: Post One Reel
on:
  workflow_dispatch:
    inputs:
      file: { description: "filename under oneoff/", required: true }
      caption: { description: "IG caption", required: false, default: "" }
permissions: { contents: read }
jobs:
  postone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Publish one Reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: graph.instagram.com
          VIDEO_URL: https://cdn.jsdelivr.net/gh/gitrecap-admin/outbed-content@main/oneoff/${{ inputs.file }}
          CAPTION: ${{ inputs.caption }}
        run: python post_one.py
