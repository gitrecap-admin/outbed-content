name: Post Outbed Reel

# Publishes ONE queued Reel per run. Three runs/day = 3 Reels/day.
# Cron is UTC. Times below = 08:00 / 13:00 / 19:00 IST (Asia/Kolkata, UTC+5:30).
# Adjust to your timezone: subtract your UTC offset from the local time you want.
on:
  schedule:
    - cron: "30 2 * * *"    # 08:00 IST
    - cron: "30 7 * * *"    # 13:00 IST
    - cron: "30 13 * * *"   # 19:00 IST
  workflow_dispatch: {}      # manual "Run workflow" button for testing

concurrency:
  group: post-reel
  cancel-in-progress: false

permissions:
  contents: write            # to commit the advanced state.json

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Dupe-proof publish, in three ordered steps:
      #   1. reserve   — build+process the media container, advance state.json
      #   2. push      — commit state.json BEFORE anything is posted
      #   3. publish   — the one non-idempotent call, runs last
      # Steps fail-fast: if reserve or the push fails, publish never runs and the
      # next scheduled slot retries the same Reel. If publish fails after IG has
      # already accepted the Reel, state.json is already advanced+pushed, so the
      # next run moves on instead of re-posting. Result: never a duplicate.

      - name: Reserve next Reel (build container + advance state)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO_BASE_URL: ${{ vars.VIDEO_BASE_URL }}
          GRAPH_HOST: graph.instagram.com   # Instagram-login flow; use graph.facebook.com for FB-login
          GRAPH_VERSION: v21.0
        run: python reserve.py

      - name: Commit advanced state (before publishing)
        run: |
          if ! git diff --quiet state.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: reserve post slot [skip ci]"
            git push   # if this fails, the job stops here and nothing is published
          else
            echo "state.json unchanged (queue empty); nothing to reserve/commit."
          fi

      - name: Publish reserved Reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: graph.instagram.com
          GRAPH_VERSION: v21.0
        run: python publish.py
